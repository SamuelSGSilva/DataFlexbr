name: FormulaFlash Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formulaflash-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar FormulaFlash e atualizar aplicações na main
        run: node automation/n8n/sync-formulaflash.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_BRANCH: main
          VEHICLES_PATH: data/vehicles.json
